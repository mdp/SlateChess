name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install LuaJIT (the interpreter KOReader embeds)
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "luajit-2.1"

      - uses: leafo/gh-actions-luarocks@v6

      - name: Install test tooling
        run: |
          luarocks install busted
          luarocks install luacheck

      - name: Test
        run: make test

      - name: Lint
        run: make lint

  release:
    # Build + publish on version tags, e.g. v1.0.0. The test job gates
    # this: tags trigger it too, so a release only ships green code.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches _meta.lua version
        run: |
          meta_version="$(sed -n 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"\([0-9.]*\)".*/\1/p' _meta.lua)"
          tag_version="${GITHUB_REF_NAME#v}"
          echo "tag v$tag_version vs _meta.lua $meta_version"
          if [ "$meta_version" != "$tag_version" ]; then
            echo "::error::Tag v$tag_version does not match _meta.lua version $meta_version"
            exit 1
          fi

      - name: Install zig
        # Cross-compiles the static Kindle ARM engine binary. Zig is
        # fetched by URL (a pinned, stable release) rather than via a
        # third-party action, to keep the release path dependency-light.
        run: |
          curl -fsSL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz -o /tmp/zig.tar.xz
          mkdir -p /tmp/zig
          tar -xJf /tmp/zig.tar.xz --strip-components=1 -C /tmp/zig
          echo "/tmp/zig" >> "$GITHUB_PATH"

      - name: Build the Kindle engine binary
        run: sh engines/fetch.sh kindle

      - name: Package both plugins
        run: |
          make package
          make puzzle-package

      - name: Smoke-test the shipped Kindle engine under QEMU
        # The release only ever runs the static 32-bit ARM (kindle) build —
        # dev/emulator testing uses the native x64 binary. Prove the exact
        # binary that ships in the zip boots, speaks UCI, and returns a
        # bestmove from a real search before publishing.
        run: |
          sudo apt-get update
          # qemu-user carries the dynamic interpreter (/usr/bin/qemu-arm);
          # -static and -binfmt cover the alternatives Ubuntu/Debian
          # package the same binaries under.
          sudo apt-get install -y qemu-user qemu-user-static qemu-user-binfmt
          mkdir -p /tmp/engine-check
          unzip -p "dist/slatechess.koplugin.v${GITHUB_REF_NAME#v}.zip" \
              slatechess.koplugin/engines/berserk > /tmp/engine-check/berserk
          chmod +x /tmp/engine-check/berserk
          file /tmp/engine-check/berserk | tee /tmp/engine-check/type.txt
          QEMU="$(command -v qemu-arm-static 2>/dev/null || command -v qemu-arm 2>/dev/null || true)"
          if [ -z "$QEMU" ]; then
            QEMU="$(find /usr/libexec /usr/bin -type f -name 'qemu-arm' -o -name 'qemu-arm-static' -o -name 'qemu-armhf*' 2>/dev/null | head -n1)"
          fi
          test -n "$QEMU" || { echo "::error::no qemu-arm emulator found"; exit 1; }
          echo "using $QEMU"
          printf 'uci\nisready\nposition startpos\ngo movetime 1000\nquit\n' \
              | timeout 120 "$QEMU" /tmp/engine-check/berserk | tee /tmp/engine-check/out.txt
          grep -q "id name Berserk" /tmp/engine-check/out.txt
          grep -q "uciok"           /tmp/engine-check/out.txt
          grep -q "bestmove"        /tmp/engine-check/out.txt
          grep -q "ELF.*ARM"        /tmp/engine-check/type.txt

      - name: Sanity-check the chess zip
        run: |
          unzip -l dist/slatechess.koplugin.v${GITHUB_REF_NAME#v}.zip
          unzip -l dist/slatechess.koplugin.v${GITHUB_REF_NAME#v}.zip | grep -E "engines/berserk$" || {
            echo "::error::The Kindle engine binary is missing from the zip"
            exit 1
          }
          unzip -l dist/slatechess.koplugin.v${GITHUB_REF_NAME#v}.zip | grep -E "CHANGELOG.md" || {
            echo "::error::CHANGELOG.md is missing from the zip (the About dialog reads it)"
            exit 1
          }

      - name: Sanity-check the puzzle zip
        run: |
          unzip -l dist/slatepuzzle.koplugin.v${GITHUB_REF_NAME#v}.zip
          unzip -l dist/slatepuzzle.koplugin.v${GITHUB_REF_NAME#v}.zip | grep -E "data/puzzles.json" || {
            echo "::error::The puzzle bank is missing from the zip"
            exit 1
          }
          unzip -l dist/slatepuzzle.koplugin.v${GITHUB_REF_NAME#v}.zip | grep -E "_meta.lua" || {
            echo "::error::_meta.lua is missing from the zip"
            exit 1
          }

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: SlateChess ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*.zip
